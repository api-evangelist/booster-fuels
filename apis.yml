aid: booster-fuels
name: Booster Fuels
description: >-
  Booster (Booster Fuels, Inc.) is a mobile energy delivery company that brings
  gasoline, diesel, diesel exhaust fluid (DEF), and renewable fuel alternatives
  directly to vehicles, fleets, and on-site fuel tanks using a fleet of Smart
  Tankers, removing the need for drivers to visit gas stations. The company
  serves enterprise fleets and local businesses across the United States, pairing
  on-demand fueling with a proprietary technology platform (BoosterOS / the Fleet
  dashboard at fleet.trybooster.com) for real-time fleet management, fuel-usage
  reporting, invoicing automation, fraud prevention, and emissions reduction.
  Booster offers custom enterprise integrations (ERP, CRM, and telematics such as
  Geotab and Samsara) but does not publish a public developer API portal,
  OpenAPI definition, or SDKs. This profile is a company/lead entry in the API
  Evangelist network; no public API surface was found during enrichment.
